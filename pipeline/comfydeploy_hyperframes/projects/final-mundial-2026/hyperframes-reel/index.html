    <script>
      const pause = (animation) => { animation.pause(); return animation; };
      pause(document.getElementById("progress-bar").animate(
        [{ transform: "scaleX(0)" }, { transform: "scaleX(1)" }],
        { duration: 22000, easing: "linear", fill: "both", iterations: 1 }
      ));
      pause(document.getElementById("brand-chip").animate(
        [{ opacity: 0, transform: "translateX(-24px)" }, { opacity: 1, transform: "translateX(0)" }],
        { duration: 420, delay: 180, easing: "cubic-bezier(.2,.8,.2,1)", fill: "both", iterations: 1 }
      ));
      pause(document.getElementById("watermark").animate(
        [{ opacity: 0, transform: "translateY(-18px)" }, { opacity: .88, transform: "translateY(0)" }],
        { duration: 450, delay: 220, easing: "cubic-bezier(.2,.8,.2,1)", fill: "both", iterations: 1 }
      ));
      document.querySelectorAll(".caption-clip").forEach((clip, index) => {
        const body = clip.querySelector(".caption-body");
        const key = clip.querySelector(".key, .gold");
        const start = Number(clip.dataset.start) * 1000;
        const duration = Number(clip.dataset.duration) * 1000;
        const rotation = [-4, 3, -2, 4][index % 4];
        const enterOffset = Math.min(.38, 220 / duration);
        const exitOffset = Math.max(enterOffset, 1 - Math.min(.22, 120 / duration));
        pause(body.animate([
          { opacity: 0, transform: `translateY(86px) scale(.64) rotate(${rotation}deg)`, offset: 0 },
          { opacity: 1, transform: "translateY(0) scale(1) rotate(0deg)", offset: enterOffset },
          { opacity: 1, transform: "translateY(0) scale(1) rotate(0deg)", offset: exitOffset },
          { opacity: 0, transform: "translateY(-42px) scale(1.12) rotate(0deg)", offset: 1 }
        ], { duration, delay: start, easing: "cubic-bezier(.2,.8,.2,1)", fill: "both", iterations: 1 }));
        if (key) pause(key.animate(
          [{ transform: "scale(.82)" }, { transform: "scale(1.08)" }, { transform: "scale(1)" }],
          { duration: Math.min(320, duration * .45), delay: start + 30, easing: "cubic-bezier(.2,.9,.25,1)", fill: "both", iterations: 1 }
        ));
      });
      [4.62, 9.90, 15.585, 19.645].forEach((time) => {
        pause(document.getElementById("cut-flash").animate(
          [{ opacity: 0 }, { opacity: .48, offset: .3 }, { opacity: 0 }],
          { duration: 120, delay: time * 1000, easing: "linear", fill: "both", iterations: 1 }
        ));
      });
