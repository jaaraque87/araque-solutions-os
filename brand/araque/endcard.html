<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; }
  #card {
    width:360px; height:640px; position:relative; overflow:hidden;
    background:radial-gradient(120% 100% at 50% 40%, #18121d 0%, #0b0a0e 60%, #050406 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family: Arial, Helvetica, sans-serif;
  }
  .logo { width:268px; height:auto; filter:drop-shadow(0 12px 46px rgba(255,45,120,0.42)); margin-bottom:40px; }
  .cta { font-weight:800; font-size:32px; letter-spacing:0.02em; color:#F6F4F8; text-transform:uppercase; }
  .cta .mag { color:#FF2D78; }
  .sub { margin-top:12px; font-weight:700; font-size:18px; letter-spacing:0.02em; color:#F6F4F8; }
  .handle { margin-top:26px; font-weight:800; font-size:17px; letter-spacing:0.14em; color:#7C4DFF; }
</style>
</head>
<body>
  <div id="card">
    <img class="logo" src="araque-lockup-transp.png" />
    <div class="cta"><span class="mag">escríbenos</span> →</div>
    <div class="handle">@araquesolutions</div>
  </div>
</body>
</html>
