<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; }
  #card {
    width:1080px; height:1080px; position:relative; overflow:hidden;
    background:radial-gradient(120% 120% at 50% 38%, #18121d 0%, #0b0a0e 60%, #050406 100%);
    display:flex; align-items:center; justify-content:center;
  }
  .mark { width:640px; height:auto; filter:drop-shadow(0 18px 70px rgba(255,45,120,0.45)); }
</style>
</head>
<body>
  <div id="card">
    <svg class="mark" viewBox="0 0 220 190" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FF2D78"/>
          <stop offset="0.55" stop-color="#B23CFF"/>
          <stop offset="1" stop-color="#7C4DFF"/>
        </linearGradient>
      </defs>
      <polyline points="20,176 110,18 200,176" fill="none" stroke="url(#g)" stroke-width="30" stroke-linejoin="round" stroke-linecap="butt"/>
      <polyline points="71,176 110,108 149,176" fill="none" stroke="url(#g)" stroke-width="26" stroke-linejoin="round" stroke-linecap="butt"/>
    </svg>
  </div>
</body>
</html>
