<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Araque Anton"; src: url("assets/fonts/anton-400.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Araque Inter"; src: url("assets/fonts/inter-800.woff2") format("woff2"); font-weight: 800; }
      @font-face { font-family: "Araque Inter"; src: url("assets/fonts/inter-600.woff2") format("woff2"); font-weight: 600; }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #050407; }
      body { font-family: "Araque Inter", Arial, sans-serif; color: #f6f4f8; }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #050407;
      }

      .avatar-wrap {
        position: absolute;
        inset: 0;
        z-index: 1;
        overflow: hidden;
        background: #050407;
      }

      .avatar-video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scale(1.06);
        transform-origin: 50% 46%;
      }

      .shade {
        position: absolute;
        inset: 0;
        z-index: 2;
        background:
          linear-gradient(180deg, rgba(5,4,7,0.72) 0%, rgba(5,4,7,0.14) 22%, rgba(5,4,7,0) 50%, rgba(5,4,7,0.28) 72%, rgba(5,4,7,0.86) 100%),
          radial-gradient(circle at 14% 86%, rgba(255,45,120,0.42), rgba(255,45,120,0) 32%),
          radial-gradient(circle at 92% 12%, rgba(124,77,255,0.36), rgba(124,77,255,0) 28%);
        pointer-events: none;
      }

      .brand {
        position: absolute;
        top: 72px;
        left: 68px;
        right: 68px;
        z-index: 6;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        min-height: 56px;
        padding: 15px 22px;
        border: 3px solid #ff2d78;
        border-radius: 999px;
        background: rgba(5,4,7,0.78);
        box-shadow: 0 0 40px rgba(255,45,120,0.32);
        font-size: 25px;
        line-height: 1;
        font-weight: 800;
        text-transform: uppercase;
      }

      .mark {
        width: 90px;
        height: 90px;
        object-fit: contain;
        filter: drop-shadow(0 10px 30px rgba(0,0,0,0.5));
      }

      .panel {
        position: absolute;
        left: 62px;
        right: 62px;
        z-index: 8;
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 34px 38px;
        border-radius: 34px;
        background: rgba(5,4,7,0.72);
        border: 2px solid rgba(246,244,248,0.18);
        box-shadow: 0 32px 120px rgba(0,0,0,0.42);
        backdrop-filter: blur(8px);
      }

      .panel.top {
        top: 205px;
        max-width: 770px;
      }

      .panel.bottom {
        bottom: 118px;
      }

      .kicker {
        color: #ff2d78;
        font-size: 26px;
        font-weight: 800;
        line-height: 1;
        text-transform: uppercase;
      }

      .hero {
        max-width: 910px;
        font-family: "Araque Anton", sans-serif;
        font-size: 78px;
        line-height: 1.02;
        text-transform: uppercase;
        letter-spacing: 0;
      }

      .line {
        max-width: 880px;
        font-size: 34px;
        line-height: 1.14;
        font-weight: 800;
        color: rgba(246,244,248,0.94);
      }

      .accent { color: #ff2d78; }

      .proof-row {
        position: absolute;
        left: 62px;
        right: 62px;
        bottom: 345px;
        z-index: 7;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 16px;
      }

      .proof {
        min-height: 104px;
        padding: 20px 18px;
        border-radius: 24px;
        background: rgba(246,244,248,0.14);
        border-left: 7px solid #ff2d78;
        box-shadow: 0 18px 80px rgba(0,0,0,0.3);
        backdrop-filter: blur(8px);
        font-size: 27px;
        line-height: 1.04;
        font-weight: 800;
        text-transform: uppercase;
      }

      .side-word {
        position: absolute;
        right: -90px;
        top: 620px;
        z-index: 3;
        font-family: "Araque Anton", sans-serif;
        font-size: 210px;
        line-height: 0.8;
        color: rgba(246,244,248,0.12);
        text-transform: uppercase;
        transform: rotate(90deg);
        pointer-events: none;
      }

      .rule {
        position: absolute;
        left: 62px;
        right: 62px;
        bottom: 72px;
        z-index: 8;
        height: 8px;
        border-radius: 99px;
        background: linear-gradient(90deg, #ff2d78, #7c4dff);
        transform-origin: left center;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{duration}}" data-width="1080" data-height="1920">
      <div class="avatar-wrap" data-layout-allow-overflow>
        <video id="avatar-video" class="avatar-video clip" data-start="0" data-duration="{{duration}}" data-track-index="1" src="assets/ltx-avatar-hf-normalized.mp4" muted playsinline></video>
        <audio id="avatar-audio" src="assets/ltx-avatar-hf-normalized.mp4" data-start="0" data-duration="{{duration}}" data-track-index="2" data-volume="{{audioVolume}}"></audio>
      </div>

      <div class="shade"></div>
      <div class="side-word" data-layout-ignore>{{sideWord}}</div>

      <div class="brand">
        <div class="pill">{{brandPill}}</div>
        <img class="mark" src="assets/araque-mark.png" />
      </div>

      <section id="beat-1" class="panel top clip" data-start="{{beat1Start}}" data-duration="{{beat1Duration}}" data-track-index="10">
        <div class="kicker">{{hookKicker}}</div>
        <div class="hero">{{hookTitle}}</div>
      </section>

      <section id="beat-2" class="proof-row clip" data-start="{{beat2Start}}" data-duration="{{beat2Duration}}" data-track-index="11">
        <div class="proof">{{proof1}}</div>
        <div class="proof">{{proof2}}</div>
        <div class="proof">{{proof3}}</div>
      </section>

      <section id="beat-3" class="panel bottom clip" data-start="{{beat3Start}}" data-duration="{{beat3Duration}}" data-track-index="12">
        <div class="kicker">{{authorityKicker}}</div>
        <div class="hero">{{authorityTitle}}</div>
        <div class="line">{{authorityLine}}</div>
      </section>

      <section id="beat-4" class="panel bottom clip" data-start="{{beat4Start}}" data-duration="{{beat4Duration}}" data-track-index="13">
        <div class="kicker">{{ctaKicker}}</div>
        <div class="hero">{{ctaTitle}}</div>
        <div class="line"><span class="accent">{{handle}}</span></div>
      </section>

      <div id="progress-rule" class="rule clip" data-start="0" data-duration="{{duration}}" data-track-index="20"></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const DURATION = {{duration}};

      tl.fromTo(".brand .pill", { opacity: 0, x: -42, scale: 0.96 }, { opacity: 1, x: 0, scale: 1, duration: 0.48, ease: "expo.out" }, 0.2);
      tl.fromTo(".mark", { opacity: 0, y: -34, scale: 0.88 }, { opacity: 1, y: 0, scale: 1, duration: 0.46, ease: "back.out(1.4)" }, 0.32);
      tl.fromTo(".rule", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.38, ease: "power3.out" }, 0.25);
      tl.to(".rule", { scaleX: 0.18, duration: Math.max(1, DURATION - 1.1), ease: "none" }, 0.75);
      tl.fromTo(".side-word", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.8, ease: "power2.out" }, 0.8);

      tl.fromTo("#beat-1", { opacity: 0, y: -42, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.62, ease: "expo.out" }, {{beat1In}});
      tl.to("#beat-1", { opacity: 0, y: -22, scale: 0.98, duration: 0.34, ease: "power2.in" }, {{beat1Out}});

      tl.fromTo("#beat-2 .proof", { opacity: 0, y: 52, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.46, stagger: 0.1, ease: "back.out(1.25)" }, {{beat2In}});
      tl.to("#beat-2 .proof", { opacity: 0, y: 24, duration: 0.26, stagger: 0.05, ease: "power2.in" }, {{beat2Out}});

      tl.fromTo("#beat-3", { opacity: 0, y: 70, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.58, ease: "expo.out" }, {{beat3In}});
      tl.to("#beat-3", { opacity: 0, y: 34, scale: 0.98, duration: 0.28, ease: "power2.in" }, {{beat3Out}});

      tl.fromTo("#beat-4", { opacity: 0, y: 70, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.58, ease: "expo.out" }, {{beat4In}});
      tl.to("#beat-4", { opacity: 0, duration: 0.22, ease: "sine.inOut" }, Math.max(0, DURATION - 0.3));
      tl.to(".mark", { y: 8, scale: 1.04, yoyo: true, repeat: Math.max(1, Math.floor(DURATION / 3)), duration: 1.4, ease: "sine.inOut" }, 1.0);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
